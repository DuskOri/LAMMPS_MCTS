mcts:
  iterations: 1
  max_steps: 3
  start_fragment: Start
  top_k: 1
  exploration_weight: 1.41421356237
  rollout_limit: 32
  random_seed: 7
  feedback_mode: thermal
  feedback_every_iteration: true
  feedback_max_evaluations: 1
  feedback_output_dir: data
  feedback_run_lammps: true
  feedback_reward_scale: 0.2
  feedback_fallback_to_heuristic: false
  feedback_failure_reward: -1.0

chemistry:
  active_families: polyimide
  custom_fragment_file: custom_fragments.json
  ai_enabled: false
  ai_api_url: https://api.openai.com/v1/chat/completions
  ai_api_key_env: OPENAI_API_KEY
  ai_model: gpt-4.1-mini
  ai_output_file: ai_fragments.json
  ai_refresh: false
  ai_temperature: 0.2
  ai_max_fragments: 8
  ai_timeout_seconds: 60
  ai_validate_rdkit: true
  ai_prompt: Generate low thermal conductivity polymer fragments for MCTS screening.
  custom_fragments: ""
  allow_custom_self_transitions: true

polymer:
  target_chain_length_angstrom: 120.0
  min_degree_of_polymerization: 1
  max_degree_of_polymerization: 100
  build_pdb: true

system:
  prepare_initial_system: true
  molecule_count: 10
  box_size: 60.0
  tolerance: 2.0
  packmol_executable: packmol
  force_field: uff_screening
  packmol_timeout_seconds: 600

thermal_conductivity:
  profile: standard
  write_fast_input: true
  temperature: 300.0
  pressure: 1.0
  timestep: 0.5
  tdamp: 50.0
  pdamp: 500.0
  cutoff: 12.0
  density_equilibration: true
  melt_temperature: 550.0
  melt_heating_steps: 10000
  melt_hold_steps: 20000
  precompression_density: 0.7
  precompression_steps: 50000
  density_block_steps: 10000
  density_sample_every: 100
  density_max_blocks: 20
  density_plateau_tolerance: 0.02
  cooling_steps: 50000
  nvt_steps: 10000
  npt_steps: 50000
  production_steps: 1000000
  nemd_hot_temperature: 450.0
  nemd_cold_temperature: 150.0
  nemd_thermostat_damp: 1.0
  nemd_steady_steps: 50000
  nemd_production_block_steps: 25000
  nemd_min_production_blocks: 5
  nemd_heat_flux_tolerance: 0.3
  nemd_profile_nevery: 10
  nemd_profile_repeat: 100
  nemd_min_gradient_r2: 0.85
  nemd_min_temperature_span: 5.0
  nemd_max_relative_error: 0.20
  nemd_energy_balance_tolerance: 0.20
  nemd_flux_agreement_tolerance: 0.30
  thermo_every: 1000
  dump_every: 10000
  random_seed: 87287
  pair_style: lj/cut/coul/long 12.0
  bond_style: harmonic
  angle_style: harmonic
  dihedral_style: harmonic
  improper_style: cvff
  kspace_style: pppm 1.0e-4
  special_bonds: amber
  force_field_include: ""
  analyze_outputs: true
  trim_fraction: 0.5

lammps:
  executable: lmp
  timeout_seconds: 7200
  compression_timeout_seconds: 3600
  nemd_timeout_seconds: 0

output:
  directory: outputs
  candidates_csv: candidates.csv
  build_results_csv: build_results.csv
  system_results_csv: system_results.csv
  thermal_inputs_csv: thermal_inputs.csv
  low_k_database_csv: low_k_database.csv
  feedback_records_csv: feedback_records.csv
  export_final_structures: true
